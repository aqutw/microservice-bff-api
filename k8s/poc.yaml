---
apiVersion: v1
kind: Namespace
metadata:
  name: commerce-poc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: website-session-data
  namespace: commerce-poc
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audit-data
  namespace: commerce-poc
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-worker
  namespace: commerce-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-worker
  template:
    metadata:
      labels:
        app: audit-worker
    spec:
      containers:
      - name: audit-worker
        image: poc/audit-worker:dev
        ports:
        - containerPort: 8084
        env:
        - name: PORT
          value: '8084'
        - name: DB_PATH
          value: "/data/audit.db"
        - name: NODE_EXTRA_CA_CERTS
          value: "/run/tls/ca.crt"
        - name: SERVICE_NAME
          value: audit-worker
        - name: SERVICE_OUTGOING_KEYS
          valueFrom:
            secretKeyRef:
              name: commerce-security
              key: AUDIT_WORKER_OUTGOING_KEYS
        - name: SERVICE_TLS_CERT
          value: "/run/tls/tls.crt"
        - name: SERVICE_TLS_KEY
          value: "/run/tls/tls.key"
        - name: SERVICE_CA_FILE
          value: "/run/tls/ca.crt"
        - name: SERVICE_INCOMING_KEYS
          valueFrom:
            secretKeyRef:
              name: commerce-security
              key: AUDIT_WORKER_INCOMING_KEYS
        volumeMounts:
        - name: data
          mountPath: "/data"
        - name: service-tls
          mountPath: "/run/tls"
          readOnly: true
        readinessProbe:
          httpGet:
            path: "/healthz"
            port: 8084
            scheme: HTTPS
          initialDelaySeconds: 2
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: audit-data
      - name: service-tls
        secret:
          secretName: commerce-audit-worker-tls
          defaultMode: 288
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
---
apiVersion: v1
kind: Service
metadata:
  name: audit-worker
  namespace: commerce-poc
spec:
  selector:
    app: audit-worker
  ports:
  - port: 8084
    targetPort: 8084
---
apiVersion: v1
