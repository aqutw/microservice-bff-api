apiVersion: v1
kind: Namespace
metadata:
  name: commerce-poc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: audit-data, namespace: commerce-poc}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: audit-worker, namespace: commerce-poc}
spec:
  replicas: 1
  selector: {matchLabels: {app: audit-worker}}
  template:
    metadata: {labels: {app: audit-worker}}
    spec:
      containers:
        - name: audit-worker
          image: poc/audit-worker:dev
          ports: [{containerPort: 8084}]
          env: [{name: PORT, value: "8084"}, {name: DB_PATH, value: /data/audit.db}]
          volumeMounts: [{name: data, mountPath: /data}]
          readinessProbe: {httpGet: {path: /healthz, port: 8084}, initialDelaySeconds: 2}
      volumes: [{name: data, persistentVolumeClaim: {claimName: audit-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: audit-worker, namespace: commerce-poc}
spec: {selector: {app: audit-worker}, ports: [{port: 8084, targetPort: 8084}]}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: inventory-data, namespace: commerce-poc}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: order-data, namespace: commerce-poc}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: payment-data, namespace: commerce-poc}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: inventory, namespace: commerce-poc}
spec:
  replicas: 1
  selector: {matchLabels: {app: inventory}}
  template:
    metadata: {labels: {app: inventory}}
    spec:
      containers:
        - name: inventory
          image: poc/inventory:dev
          ports: [{containerPort: 8082}]
          env: [{name: PORT, value: "8082"}, {name: DB_PATH, value: /data/inventory.db}, {name: AUDIT_WORKER_URL, value: http://audit-worker:8084}]
          volumeMounts: [{name: data, mountPath: /data}]
          readinessProbe: {httpGet: {path: /healthz, port: 8082}, initialDelaySeconds: 2}
      volumes: [{name: data, persistentVolumeClaim: {claimName: inventory-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: inventory, namespace: commerce-poc}
spec: {selector: {app: inventory}, ports: [{port: 8082, targetPort: 8082}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: order, namespace: commerce-poc}
spec:
  replicas: 1
  selector: {matchLabels: {app: order}}
  template:
    metadata: {labels: {app: order}}
    spec:
      containers:
        - name: order
          image: poc/order:dev
          ports: [{containerPort: 8081}]
          env: [{name: PORT, value: "8081"}, {name: DB_PATH, value: /data/order.db}, {name: AUDIT_WORKER_URL, value: http://audit-worker:8084}, {name: INVENTORY_API_URL, value: http://inventory:8082}, {name: PAYMENT_API_URL, value: http://payment:8083}]
          volumeMounts: [{name: data, mountPath: /data}]
          readinessProbe: {httpGet: {path: /healthz, port: 8081}, initialDelaySeconds: 2}
      volumes: [{name: data, persistentVolumeClaim: {claimName: order-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: order, namespace: commerce-poc}
spec: {selector: {app: order}, ports: [{port: 8081, targetPort: 8081}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: payment, namespace: commerce-poc}
spec:
  replicas: 1
  selector: {matchLabels: {app: payment}}
  template:
    metadata: {labels: {app: payment}}
    spec:
      containers:
        - name: payment
          image: poc/payment:dev
          ports: [{containerPort: 8083}]
          env: [{name: PORT, value: "8083"}, {name: DB_PATH, value: /data/payment.db}, {name: AUDIT_WORKER_URL, value: http://audit-worker:8084}]
          volumeMounts: [{name: data, mountPath: /data}]
          readinessProbe: {httpGet: {path: /healthz, port: 8083}, initialDelaySeconds: 2}
      volumes: [{name: data, persistentVolumeClaim: {claimName: payment-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: payment, namespace: commerce-poc}
spec: {selector: {app: payment}, ports: [{port: 8083, targetPort: 8083}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: desktop-bff, namespace: commerce-poc}
spec:
  replicas: 1
  selector: {matchLabels: {app: desktop-bff}}
  template:
    metadata: {labels: {app: desktop-bff}}
    spec:
      containers:
        - name: desktop-bff
          image: poc/bff-api:dev
          command: [node, src/desktop.js]
          ports: [{containerPort: 3001}]
          env:
            - {name: PORT, value: "3001"}
            - {name: ORDER_API_URL, value: http://order:8081}
            - {name: INVENTORY_API_URL, value: http://inventory:8082}
            - {name: PAYMENT_API_URL, value: http://payment:8083}
            - {name: AUDIT_API_URL, value: http://audit-worker:8084}
---
apiVersion: v1
kind: Service
metadata: {name: desktop-bff, namespace: commerce-poc}
spec:
  type: NodePort
  selector: {app: desktop-bff}
  ports: [{port: 3001, targetPort: 3001, nodePort: 30001}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: app-bff, namespace: commerce-poc}
spec:
  replicas: 1
  selector: {matchLabels: {app: app-bff}}
  template:
    metadata: {labels: {app: app-bff}}
    spec:
      containers:
        - name: app-bff
          image: poc/bff-api:dev
          command: [node, src/app.js]
          ports: [{containerPort: 3002}]
          env:
            - {name: PORT, value: "3002"}
            - {name: ORDER_API_URL, value: http://order:8081}
            - {name: INVENTORY_API_URL, value: http://inventory:8082}
            - {name: PAYMENT_API_URL, value: http://payment:8083}
            - {name: AUDIT_API_URL, value: http://audit-worker:8084}
---
apiVersion: v1
kind: Service
metadata: {name: app-bff, namespace: commerce-poc}
spec:
  type: NodePort
  selector: {app: app-bff}
  ports: [{port: 3002, targetPort: 3002, nodePort: 30002}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: website, namespace: commerce-poc}
spec:
  replicas: 1
  selector: {matchLabels: {app: website}}
  template:
    metadata: {labels: {app: website}}
    spec:
      containers:
        - name: website
          image: poc/website:dev
          ports: [{containerPort: 3000}]
          env: [{name: BFF_URL, value: http://desktop-bff:3001}]
---
apiVersion: v1
kind: Service
metadata: {name: website, namespace: commerce-poc}
spec:
  type: NodePort
  selector: {app: website}
  ports: [{port: 3000, targetPort: 3000, nodePort: 30000}]
