        ports:
        - containerPort: 3000
        env:
        - name: BFF_URL
          value: https://desktop-bff:3001
        - name: NODE_EXTRA_CA_CERTS
          value: "/run/tls/ca.crt"
        - name: AUTH_ISSUER
          valueFrom:
            secretKeyRef:
              name: commerce-security
              key: AUTH_ISSUER
        - name: AUTH_AUDIENCE
          valueFrom:
            secretKeyRef:
              name: commerce-security
              key: AUTH_AUDIENCE
        - name: AUTH_JWKS_URL
          valueFrom:
            secretKeyRef:
              name: commerce-security
              key: AUTH_JWKS_URL
        - name: DEPLOYMENT_ENV
          value: production
        - name: PUBLIC_URL
          valueFrom:
            secretKeyRef:
              name: commerce-security
              key: PUBLIC_URL
        - name: OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: commerce-security
              key: OIDC_CLIENT_ID
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
