          mountPath: "/data"
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
      - name: service-tls
        secret:
          secretName: commerce-website-ca
          defaultMode: 288
      - name: sessions
        persistentVolumeClaim:
          claimName: website-session-data
