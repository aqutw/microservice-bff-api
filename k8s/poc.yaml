          app: order
    ports:
    - protocol: TCP
      port: 8081
  - to:
    - podSelector:
        matchLabels:
          app: audit-worker
    ports:
    - protocol: TCP
      port: 8084
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audit-worker-access
  namespace: commerce-poc
spec:
  podSelector:
    matchLabels:
      app: audit-worker
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: desktop-bff
    - podSelector:
        matchLabels:
          app: app-bff
    - podSelector:
        matchLabels:
          app: order
    - podSelector:
        matchLabels:
          app: inventory
    - podSelector:
        matchLabels:
          app: payment
    ports:
    - protocol: TCP
      port: 8084
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: commerce
  namespace: commerce-poc
spec:
  gatewayClassName: commerce-gateway
  infrastructure:
    labels:
      commerce-edge: 'true'
  listeners:
  - name: http
    port: 80
    protocol: HTTP
  - name: website
    port: 443
    protocol: HTTPS
    hostname: commerce.example.com
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: commerce-edge-tls
  - name: app-api
    port: 443
    protocol: HTTPS
    hostname: api.example.com
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: commerce-edge-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: website
  namespace: commerce-poc
spec:
  parentRefs:
  - name: commerce
    sectionName: website
  hostnames:
  - commerce.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: "/"
    backendRefs:
    - name: website
      port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-bff
  namespace: commerce-poc
spec:
  parentRefs:
  - name: commerce
    sectionName: app-api
  hostnames:
  - api.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: "/"
    backendRefs:
    - name: app-bff
      port: 3002
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: commerce-poc
spec:
  parentRefs:
  - name: commerce
    sectionName: http
  hostnames:
  - commerce.example.com
  - api.example.com
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: app-bff-tls
  namespace: commerce-poc
spec:
  targetRefs:
  - group: ''
    kind: Service
    name: app-bff
  validation:
    hostname: app-bff
    caCertificateRefs:
    - group: ''
      kind: ConfigMap
      name: commerce-service-ca
