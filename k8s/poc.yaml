  template:
    metadata:
      labels:
        app: desktop-bff
    spec:
      containers:
      - name: desktop-bff
        image: poc/bff-api:dev
        command:
        - node
        - src/desktop.js
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          value: '3001'
        - name: ORDER_API_URL
          value: https://order:8081
        - name: INVENTORY_API_URL
          value: https://inventory:8082
        - name: PAYMENT_API_URL
          value: https://payment:8083
        - name: AUDIT_API_URL
