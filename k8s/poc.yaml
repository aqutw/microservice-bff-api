---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: website-access
  namespace: commerce-poc
spec:
  podSelector:
    matchLabels:
      app: website
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          commerce-edge: 'true'
    ports:
    - protocol: TCP
      port: 3000
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - podSelector:
        matchLabels:
          app: desktop-bff
    ports:
    - protocol: TCP
      port: 3001
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 443
