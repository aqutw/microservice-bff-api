            secretKeyRef:
              name: commerce-security
              key: DESKTOP_BFF_OUTGOING_KEYS
        - name: SERVICE_TLS_CERT
          value: "/run/tls/tls.crt"
        - name: SERVICE_TLS_KEY
          value: "/run/tls/tls.key"
        - name: SERVICE_CA_FILE
          value: "/run/tls/ca.crt"
        - name: AUTH_ISSUER
          valueFrom:
            secretKeyRef:
              name: commerce-security
              key: AUTH_ISSUER
        - name: AUTH_AUDIENCE
          valueFrom:
            secretKeyRef:
              name: commerce-security
              key: AUTH_AUDIENCE
        - name: AUTH_JWKS_URL
          valueFrom:
            secretKeyRef:
              name: commerce-security
              key: AUTH_JWKS_URL
        - name: DEPLOYMENT_ENV
          value: production
        - name: ALLOWED_ORIGINS
          valueFrom:
            secretKeyRef:
              name: commerce-security
              key: PUBLIC_URL
        - name: AUTH_ALGORITHMS
          valueFrom:
            secretKeyRef:
              name: commerce-security
              key: AUTH_ALGORITHMS
              optional: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: service-tls
          mountPath: "/run/tls"
          readOnly: true
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
      - name: service-tls
        secret:
          secretName: commerce-desktop-bff-tls
          defaultMode: 288
