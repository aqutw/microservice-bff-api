services:
  audit-worker:
    build: ./services/audit-worker
    ports: ["8084:8084"]
    volumes: [audit-data:/data]
  inventory:
    build: ./services/inventory
    environment:
      AUDIT_WORKER_URL: http://audit-worker:8084
    ports: ["8082:8082"]
    volumes: [inventory-data:/data]
  order:
    build: ./services/order
    environment:
      AUDIT_WORKER_URL: http://audit-worker:8084
      INVENTORY_API_URL: http://inventory:8082
      PAYMENT_API_URL: http://payment:8083
    ports: ["8081:8081"]
    volumes: [order-data:/data]
  payment:
    build: ./services/payment
    environment:
      AUDIT_WORKER_URL: http://audit-worker:8084
    ports: ["8083:8083"]
    volumes: [payment-data:/data]
  desktop-bff:
    build: ./bff-api
    command: ["node", "src/desktop.js"]
    environment:
      ORDER_API_URL: http://order:8081
      INVENTORY_API_URL: http://inventory:8082
      PAYMENT_API_URL: http://payment:8083
      AUDIT_API_URL: http://audit-worker:8084
      PORT: "3001"
    ports: ["3001:3001"]
    depends_on: [order, inventory, payment, audit-worker]
  app-bff:
    build: ./bff-api
    command: ["node", "src/app.js"]
    environment:
      ORDER_API_URL: http://order:8081
      INVENTORY_API_URL: http://inventory:8082
      PAYMENT_API_URL: http://payment:8083
      AUDIT_API_URL: http://audit-worker:8084
      PORT: "3002"
    ports: ["3002:3002"]
    depends_on: [order, inventory, payment, audit-worker]
  website:
    build: ./website
    environment:
      BFF_URL: http://desktop-bff:3001
    ports: ["3000:3000"]
    depends_on: [desktop-bff]
volumes:
  audit-data:
  inventory-data:
  order-data:
  payment-data:
