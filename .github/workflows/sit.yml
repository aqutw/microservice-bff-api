name: sit

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sit-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  sit:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.dev.yml
      COMPOSE_ENV_FILES: .env.security
      COMPOSE_PROJECT_NAME: poc-sit-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate isolated local identity credentials
        run: node scripts/init-security.mjs
      - name: Build and start real services
        run: |
          mkdir -p artifacts/sit
          set -o pipefail
          docker compose up --build -d 2>&1 | tee artifacts/sit/build.log
      - name: Run identity and access integration tests
        run: |
          set -o pipefail
          NODE_EXTRA_CA_CERTS="$PWD/.security/pki/ca.pem" node scripts/security-sit.mjs 2>&1 | tee artifacts/sit/identity.log
      - name: Run system integration tests
        run: |
          set -o pipefail
          bash scripts/sit.sh 2>&1 | tee artifacts/sit/tests.log
      - name: Collect service diagnostics
        if: always()
        run: |
          mkdir -p artifacts/sit
          docker compose ps --all > artifacts/sit/compose-ps.txt 2>&1 || true
          docker compose logs --no-color --timestamps > artifacts/sit/compose.log 2>&1 || true
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync("artifacts/sit/result.json", JSON.stringify({sourceRevision:process.env.GITHUB_SHA,status:process.env.SIT_JOB_STATUS}))'
        env:
          SIT_JOB_STATUS: ${{ job.status }}
      - name: Upload SIT results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/sit/*.log
            artifacts/sit/compose-ps.txt
            artifacts/sit/result.json
          retention-days: 7
      - name: Remove test containers and volumes
        if: always()
        run: docker compose down -v --remove-orphans
