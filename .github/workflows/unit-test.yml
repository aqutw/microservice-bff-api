name: unit-test

on:
  push:
    branches-ignore:
      - 'loadtest-**'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  go-test:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'loadtest-')
    strategy:
      fail-fast: false
      matrix:
        service: [order, inventory, payment, audit-worker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
      - name: Test ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: go test ./...

  bff-contract-test:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'loadtest-')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bff-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts
      - run: npm test
      - run: node --test ../loadtest/commerce.test.mjs

  website-build:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'loadtest-')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
