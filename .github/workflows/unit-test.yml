name: unit-test

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  go-test:
    strategy:
      fail-fast: false
      matrix:
        service: [order, inventory, payment, audit-worker, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Test ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: go test -race ./...

  settlement-sit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix bff-api --ignore-scripts
      - run: node scripts/settlement-sit.mjs
      - name: Upload settlement recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settlement-sit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/settlement-sit-*/*.log
            artifacts/settlement-sit-*/result.json
          retention-days: 7

  bff-contract-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bff-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node --test ../loadtest/commerce.test.mjs
      - run: node --test ../scripts/test/sit-report.test.mjs

  website-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
