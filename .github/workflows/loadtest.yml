name: loadtest

on:
  push:
    branches:
      - 'loadtest-**'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loadtest-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  k6:
    if: github.ref_type == 'branch' && startsWith(github.head_ref || github.ref_name, 'loadtest-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.dev.yml
      COMPOSE_ENV_FILES: .env.security
      COMPOSE_PROJECT_NAME: poc-loadtest-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate isolated local identity credentials
        run: node scripts/init-security.mjs
      - name: Build and start services
        run: |
          mkdir -p artifacts/loadtest
          set -o pipefail
          docker compose up --build -d 2>&1 | tee artifacts/loadtest/build.log
      - name: Wait for service health
        run: |
          wait_http() {
            local url=$1 max_time=${2:-3}
            for attempt in {1..60}; do
              if curl --cacert .security/pki/ca.pem --fail --silent --show-error --max-time "$max_time" "$url" >/dev/null; then
                echo "Ready: $url"
                return 0
              fi
              if [ "$attempt" != 60 ]; then sleep 1; fi
            done
            echo "::error::Service did not become ready: $url" >&2
            return 1
          }
          for port in 8081 8082 8083 8084 3001 3002; do
            wait_http "https://127.0.0.1:${port}/healthz"
          done
          wait_http http://127.0.0.1:3000/audit 10
      - name: Prepare authenticated test tokens
        run: node scripts/test-tokens.mjs
      - name: Run k6 scenarios
        run: |
          docker run --rm --network host --env-file .security/tokens.env --env SSL_CERT_FILE=/certs/ca.pem \
            --volume "$PWD/.security/pki/ca.pem:/certs/ca.pem:ro" \
            --volume "$PWD/loadtest:/scripts:ro" \
            --volume "$PWD/artifacts/loadtest:/results" \
            grafana/k6:0.54.0 run \
            --summary-export=/results/k6-summary.json \
            /scripts/commerce.js 2>&1 | tee artifacts/loadtest/k6.log
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p artifacts/loadtest
          docker compose ps --all > artifacts/loadtest/compose-ps.txt || true
          docker compose logs --no-color --timestamps > artifacts/loadtest/compose.log 2>&1 || true
      - name: Upload loadtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadtest-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/loadtest/
          retention-days: 7
      - name: Remove test containers and volumes
        if: always()
        run: docker compose down -v --remove-orphans
